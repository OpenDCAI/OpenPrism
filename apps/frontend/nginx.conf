map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Access log without the query string: images, PDFs, event streams and websockets carry a credential in ?token=
# (a short-lived URL token scoped to one project, never the account's own token), which must not end up in logs.
# Behind a TLS-terminating ingress the scheme must come from its header, not from this (plain http) hop.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

log_format no_args '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 8080;
    server_name _;
    access_log /dev/stdout no_args;

    root /usr/share/nginx/html;
    index index.html;

    # Tokens appear in some URLs, so never send them on as a Referer.
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 200m;   # project uploads and PDFs, as the API allows

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;          # collaboration websocket
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;                             # server-sent events (arXiv import) must stream
        proxy_read_timeout 3600s;                        # long-lived sockets; AI endpoints wait up to 5 minutes
    }

    # Django admin (#79): superusers only, enforced by the api. Its pages must never be cached or framed.
    location = /admin { return 301 /admin/; }
    location /admin/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        # Not "no-referrer" like the app: with it browsers send `Origin: null` on the login form's POST and Django's CSRF
        # check refuses it. `same-origin` still sends nothing to other sites, and admin URLs carry no tokens.
        proxy_hide_header Referrer-Policy;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;                                   # never framed
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The admin's CSS and JS, served by WhiteNoise in the api.
    location /static/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }

    # Built assets are content-hashed: cache them for good. index.html must always be revalidated.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri /index.html;   # client-side routing
    }
}
