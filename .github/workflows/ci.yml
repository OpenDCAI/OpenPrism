# What runs when (#61): every push and pull request gets the quick checks (typecheck, the Helm chart and Caddy checks, the API and
# AI-worker suites); pushes and pull requests to main and release/* also build the TeX worker (TeX Live plus the
# tectonic bundle, ~6 GB) and run its suite and the full browser suite against the compose stack.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_PROJECT_NAME: openprism

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - run: npm run typecheck

  deploy-checks:
    # The Helm chart, the Caddy reference config and the deploy scripts: all static, none of it touches a cluster.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: {version: v3.16.4}
      - name: Lint and render the Helm chart
        run: |
          set -euo pipefail
          chart=deploy/helm/openprism
          helm lint "$chart" -f "$chart/ci/test-values.yaml"
          helm template openprism "$chart" -f "$chart/ci/test-values.yaml" -n openprism > /tmp/render.yaml
          echo "rendered $(grep -c '^kind:' /tmp/render.yaml) objects"
          # What the deployment relies on: the one NodePort, the fixed `api` Service name nginx proxies to, no data
          # services or Ingress, and no root credentials in the app.
          grep -q 'type: NodePort' /tmp/render.yaml
          grep -qE '^  name: api$' /tmp/render.yaml
          ! grep -qE '^kind: (Ingress|StatefulSet|PersistentVolumeClaim)$' /tmp/render.yaml
          ! grep -qiE 'POSTGRES_PASSWORD|MINIO_ROOT' /tmp/render.yaml
          # The API's probes reach the pod by IP: they must send a Host that DJANGO_ALLOWED_HOSTS accepts (#74).
          [ "$(grep -c 'name: Host, value: api' /tmp/render.yaml)" -eq 3 ]
          grep -qE 'DJANGO_ALLOWED_HOSTS: "[^"]*,api"' /tmp/render.yaml
          # Required secrets are enforced when the chart renders them: missing ones fail, not render a broken release.
          ! helm template openprism "$chart" -f "$chart/ci/test-values.yaml" --set secrets.DJANGO_SECRET_KEY= >/dev/null 2>&1
          # No image tag: the images are the chart's own release (v + appVersion = apps/api/VERSION at the tag).
          helm template openprism "$chart" -f "$chart/ci/test-values.yaml" --set image.tag= \
            | grep -q "openprism/api:v$(tr -d '[:space:]' < apps/api/VERSION)$"
      - name: Render the chart as Argo CD does (deploy/argocd)
        run: |
          set -euo pipefail
          chart=deploy/helm/openprism
          # Argo renders with `helm template` and the cent values only: no secrets in values, Secrets come sealed.
          helm template openprism "$chart" -f deploy/argocd/values-cent.yaml -n openprism > /tmp/argo.yaml
          ! grep -qE '^kind: Secret$' /tmp/argo.yaml                       # no plaintext Secret is rendered
          grep -q 'argocd.argoproj.io/hook: Sync' /tmp/argo.yaml            # migrations are a Sync hook
          grep -q 'argocd.argoproj.io/hook: PostSync' /tmp/argo.yaml        # and the version check runs after
          [ "$(grep -c 'argocd.argoproj.io/sync-wave: "1"' /tmp/argo.yaml)" -eq 6 ]   # every Deployment after migrations
          grep -q "openprism/api:v$(tr -d '[:space:]' < apps/api/VERSION)$" /tmp/argo.yaml
          # The Argo manifests are well-formed and stay inside their projects.
          python3 - <<'PY'
          import glob, yaml
          for f in sorted(glob.glob('deploy/argocd/**/*.yaml', recursive=True)):
              for d in yaml.safe_load_all(open(f)):
                  if d and d.get('kind') == 'Application':
                      assert d['metadata']['namespace'] == 'argocd', f
                      assert d['spec']['project'] in ('openprism', 'openprism-platform'), f
                      if d['spec']['project'] == 'openprism':
                          assert d['spec']['destination']['namespace'] == 'openprism', f
              print('ok', f)
          PY
      - name: Validate the Caddy config
        run: |
          docker run --rm -v "$PWD/deploy/caddy:/c:ro" caddy:2-alpine \
            caddy validate --config /c/openprism.Caddyfile --adapter caddyfile
      - name: Check the deploy scripts
        run: |
          set -euo pipefail
          for f in deploy/bootstrap/*.sh deploy/smoke-release.sh deploy/diagnose.sh deploy/seal-secrets.sh; do bash -n "$f"; echo "syntax ok: $f"; done
          python3 -m py_compile deploy/bootstrap/s3-init.py && echo "syntax ok: s3-init.py"
          shellcheck -S warning deploy/bootstrap/*.sh deploy/smoke-release.sh deploy/diagnose.sh deploy/seal-secrets.sh

  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/stack
        with: {services: postgres redis garage api}
      - run: docker compose run --rm api python manage.py test --noinput
      - if: failure()
        run: docker compose logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with: {name: api-tests-logs, path: compose.log}

  ai-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/stack
        with: {services: postgres redis garage api worker-ai}
      - run: docker compose run --rm worker-ai python manage.py test ai --noinput
      - if: failure()
        run: docker compose logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with: {name: ai-tests-logs, path: compose.log}

  # The TeX image is built once and used by both its suite and the browser suite, so they share a job.
  tex-and-browser:
    if: >-
      github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') ||
      (github.event_name == 'pull_request' && (github.base_ref == 'main' || startsWith(github.base_ref, 'release/')))
    runs-on: ubuntu-24.04   # not ubuntu-latest: it is 26.04 now and Playwright 1.55 does not support it (#155)
    timeout-minutes: 90
    steps:
      - name: Free disk space for the TeX image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af >/dev/null
          df -h /
      - uses: actions/checkout@v4
      - uses: ./.github/actions/stack
        with: {services: postgres redis garage mailpit api worker-tex worker-ai beat web}
      - run: docker compose run --rm worker-tex python manage.py test jobs transfer --noinput
      - name: Load the built-in templates (template and transfer specs use them)
        run: docker compose exec -T api python manage.py load_builtin_templates
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The production web image (nginx) on :8080 rather than the Vite dev server: what users get, and no file polling.
      - run: npm run e2e -- --reporter=line,html
        env: {E2E_BASE_URL: 'http://localhost:8080', CI: '1'}
      - if: failure()
        run: docker compose logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: |
            apps/frontend/playwright-report
            apps/frontend/test-results
            compose.log
