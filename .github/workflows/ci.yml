# What runs when (#61): every push and pull request gets the quick checks (typecheck, the Helm chart and Caddy checks, the API and
# AI-worker suites); pushes and pull requests to main and release/* also build the TeX worker (TeX Live plus the
# tectonic bundle, ~6 GB) and run its suite and the full browser suite against the compose stack.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_PROJECT_NAME: openprism

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - run: npm run typecheck

  deploy-checks:
    # The Helm chart, the Caddy reference config and the deploy scripts: all static, none of it touches a cluster.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: {version: v3.16.4}
      - name: Lint and render the Helm chart
        run: |
          set -euo pipefail
          chart=deploy/helm/openprism
          helm lint "$chart" -f "$chart/ci/test-values.yaml"
          helm template openprism "$chart" -f "$chart/ci/test-values.yaml" -n openprism > /tmp/render.yaml
          echo "rendered $(grep -c '^kind:' /tmp/render.yaml) objects"
          # What the deployment relies on: the one NodePort, the fixed `api` Service name nginx proxies to, no data
          # services or Ingress, and no root credentials in the app.
          grep -q 'type: NodePort' /tmp/render.yaml
          grep -qE '^  name: api$' /tmp/render.yaml
          ! grep -qE '^kind: (Ingress|StatefulSet|PersistentVolumeClaim)$' /tmp/render.yaml
          ! grep -qiE 'POSTGRES_PASSWORD|MINIO_ROOT' /tmp/render.yaml
          # Required inputs are enforced: no image tag and no secrets must fail, not render a broken release.
          ! helm template openprism "$chart" -f "$chart/ci/test-values.yaml" --set image.tag= >/dev/null 2>&1
          ! helm template openprism "$chart" -f "$chart/ci/test-values.yaml" --set secrets.DJANGO_SECRET_KEY= >/dev/null 2>&1
      - name: Validate the Caddy config
        run: |
          docker run --rm -v "$PWD/deploy/caddy:/c:ro" caddy:2-alpine \
            caddy validate --config /c/openprism.Caddyfile --adapter caddyfile
      - name: Check the deploy scripts
        run: |
          set -euo pipefail
          for f in deploy/bootstrap/*.sh deploy/smoke-release.sh; do bash -n "$f"; echo "syntax ok: $f"; done
          python3 -m py_compile deploy/bootstrap/s3-init.py && echo "syntax ok: s3-init.py"
          shellcheck -S warning deploy/bootstrap/*.sh deploy/smoke-release.sh

  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/stack
        with: {services: postgres redis garage api}
      - run: docker compose run --rm api python manage.py test --noinput
      - if: failure()
        run: docker compose logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with: {name: api-tests-logs, path: compose.log}

  ai-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/stack
        with: {services: postgres redis garage api worker-ai}
      - run: docker compose run --rm worker-ai python manage.py test ai --noinput
      - if: failure()
        run: docker compose logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with: {name: ai-tests-logs, path: compose.log}

  # The TeX image is built once and used by both its suite and the browser suite, so they share a job.
  tex-and-browser:
    if: >-
      github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') ||
      (github.event_name == 'pull_request' && (github.base_ref == 'main' || startsWith(github.base_ref, 'release/')))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space for the TeX image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af >/dev/null
          df -h /
      - uses: actions/checkout@v4
      - uses: ./.github/actions/stack
        with: {services: postgres redis garage mailpit api worker-tex worker-ai beat web}
      - run: docker compose run --rm worker-tex python manage.py test jobs transfer --noinput
      - name: Load the built-in templates (template and transfer specs use them)
        run: docker compose exec -T api python manage.py import_legacy --skip-projects
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The production web image (nginx) on :8080 rather than the Vite dev server: what users get, and no file polling.
      - run: npm run e2e -- --reporter=line,html
        env: {E2E_BASE_URL: 'http://localhost:8080', CI: '1'}
      - if: failure()
        run: docker compose logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: |
            apps/frontend/playwright-report
            apps/frontend/test-results
            compose.log
