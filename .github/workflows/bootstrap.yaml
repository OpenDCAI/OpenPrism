name: Bootstrap hosted services
run-name: ${{ github.actor }} is bootstrapping Postgres and MinIO

# The same first-deploy step as in deploy-cent-k8s.yaml, runnable on its own (#70): creates the openprism database,
# role, bucket and bucket-limited MinIO user, and the cluster Secret openprism-app-creds. A no-op once that Secret
# exists. Manual only: never add a push or pull_request trigger (the repo is public, the runner is inside the cluster).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-openprism
  cancel-in-progress: false

env:
  K8S_NAMESPACE: openprism
  KUBE_CONFIG: kube.config

jobs:
  bootstrap:
    runs-on: [self-hosted, linux, cent]
    steps:
      - uses: actions/checkout@v4

      - name: Materialize kubeconfig from secret
        uses: mobiledevops/secret-to-file-action@v1
        with:
          base64-encoded-secret: ${{ secrets.KUBECONFIG_CENT_BASE64 }}
          filename: ${{ env.KUBE_CONFIG }}
          is-executable: false
          working-directory: "."

      - name: Bootstrap Postgres and MinIO
        env:
          NAMESPACE: ${{ env.K8S_NAMESPACE }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          MINIO_HOST: ${{ secrets.MINIO_HOST }}
          MINIO_PORT: ${{ secrets.MINIO_PORT }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
        run: |
          export KUBECONFIG="$PWD/$KUBE_CONFIG"
          bash deploy/bootstrap/bootstrap.sh
