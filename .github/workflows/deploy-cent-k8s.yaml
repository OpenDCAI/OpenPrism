name: Release - build images & deploy to cent k8s
run-name: ${{ github.actor }} is releasing ${{ github.ref_name }}

# Modelled on cent-ischool/graderthan: a release happens ONLY on a version tag (vX.Y.Z), never on a plain push.
# Per CLAUDE.md the release branch merges to main and is tagged; the tag must equal apps/api/VERSION.
# workflow_dispatch re-deploys an existing release without rebuilding it: give `tag` (its images must already exist)
# and leave `build` off. Chart, scripts and this workflow come from the ref you run it on.
#
# Runs on the cluster's self-hosted runner (the repo is public, so this workflow must never run on pull_request).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to deploy, e.g. v0.1.0.3 (blank = the tag this run was started from)"
        required: false
        type: string
        default: ""
      build:
        description: "Build and push the images first (only from a release tag; leave off when giving `tag`)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

# Two releases must not touch the cluster at once; a running deploy is never cancelled half-way.
concurrency:
  group: deploy-openprism
  cancel-in-progress: false

env:
  K8S_NAMESPACE: openprism
  HELM_RELEASE: openprism
  KUBE_CONFIG: kube.config
  # docker-build-push prepends the repo owner, so `openprism/api` becomes ghcr.io/cent-ischool/openprism/api
  # (matching image.registry in deploy/helm/openprism/values.yaml).
  PUBLIC_URL: https://openprism.cent-su.org

jobs:
  check:
    name: Check the tag
    runs-on: [self-hosted, linux, cent]
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_BUILD: ${{ inputs.build }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            # Redeploying an existing release: the images are not rebuilt, so they must already exist.
            case "$INPUT_TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::tag '$INPUT_TAG' is not a release tag like v0.1.0"; exit 1;; esac
            if [ "$INPUT_BUILD" = "true" ]; then
              echo "::error::Building under the existing tag $INPUT_TAG from ref $REF_NAME would label other code as that release. Set build to false."
              exit 1
            fi
            tag="$INPUT_TAG"
          else
            if [ "$REF_TYPE" != "tag" ]; then
              echo "::error::Releases run from a version tag. Run from a tag, or give the 'tag' input to redeploy an existing release."
              exit 1
            fi
            version="$(tr -d '[:space:]' < apps/api/VERSION)"
            if [ "$REF_NAME" != "v$version" ]; then
              echo "::error::Tag $REF_NAME does not match apps/api/VERSION (v$version). Bump the version on the release branch, then tag."
              exit 1
            fi
            tag="$REF_NAME"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Build & push ${{ matrix.image }}
    needs: [check]
    # A redeploy of an existing tag (build off) skips this whole job.
    if: ${{ github.event_name == 'push' || inputs.build }}
    runs-on: [self-hosted, linux, cent]
    strategy:
      # The runner is one shared machine with a finite disk (the TeX image alone is ~6 GB, #69): build one image at a
      # time, and do not let one failed push cancel the slow build of another.
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - {image: openprism/api,         directory: apps/api, dockerfile: apps/api/Dockerfile,          target: api}
          - {image: openprism/worker-tex,  directory: apps/api, dockerfile: apps/api/Dockerfile,          target: tex}
          - {image: openprism/worker-ai,   directory: apps/api, dockerfile: apps/api/Dockerfile,          target: ai}
          # The web image copies /design and apps/api/VERSION, so its build context is the repository root.
          - {image: openprism/web,         directory: .,        dockerfile: apps/frontend/Dockerfile,     target: ''}
    steps:
      - uses: actions/checkout@v4

      - name: Check free disk space on the runner
        run: |
          root="$(docker info --format '{{.DockerRootDir}}')"
          free_gb="$(df -BG --output=avail "$root" | tail -1 | tr -dc '0-9')"
          echo "Docker data root $root has ${free_gb} GB free"
          docker system df || true
          if [ "$free_gb" -lt 12 ]; then
            echo "::error::Only ${free_gb} GB free under $root; the images need about 12 GB. Free space on the runner (docker image prune, old _work directories) and re-run."
            exit 1
          fi

      - name: Build and push image
        uses: mr-smithers-excellent/docker-build-push@v6
        with:
          image: ${{ matrix.image }}
          registry: ghcr.io
          tags: ${{ needs.check.outputs.tag }}
          dockerfile: ${{ matrix.dockerfile }}
          directory: ${{ matrix.directory }}
          target: ${{ matrix.target }}
          addLatest: false
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PASSWORD }}
          pushImage: true

      # The image is in the registry now; the runner has no use for it. Only this release's tag and dangling layers are
      # removed: other repositories' images and caches on the shared runner are left alone.
      - name: Free the runner's disk
        if: always()
        env:
          IMAGE_REF: ghcr.io/cent-ischool/${{ matrix.image }}:${{ needs.check.outputs.tag }}
        run: |
          docker image rm "$IMAGE_REF" 2>&1 || true
          docker image prune -f 2>&1 | tail -1 || true

  deploy:
    name: Deploy to the cluster
    needs: [check, build]
    # build is skipped on a redeploy; any other result than success or skipped stops the deploy.
    if: ${{ !cancelled() && needs.check.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: [self-hosted, linux, cent]
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Materialize kubeconfig from secret
        uses: mobiledevops/secret-to-file-action@v1
        with:
          base64-encoded-secret: ${{ secrets.KUBECONFIG_CENT_BASE64 }}
          filename: ${{ env.KUBE_CONFIG }}
          is-executable: false
          working-directory: "."

      - name: Smoke-test cluster access
        run: kubectl --kubeconfig=./${{ env.KUBE_CONFIG }} cluster-info

      - name: Soft-create namespace
        run: |
          kubectl create namespace "$K8S_NAMESPACE" --dry-run=client -o yaml \
            | kubectl --kubeconfig=./"$KUBE_CONFIG" apply -f -

      - name: Soft-create ghcr image-pull secret
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PASSWORD: ${{ secrets.GHCR_PASSWORD }}
        run: |
          kubectl create secret docker-registry ghcr-login-secret \
            --docker-server=https://ghcr.io \
            --docker-username="$GHCR_USERNAME" \
            --docker-password="$GHCR_PASSWORD" \
            --dry-run=client -o yaml \
            | kubectl --kubeconfig=./"$KUBE_CONFIG" --namespace="$K8S_NAMESPACE" apply -f -

      # The root Postgres / MinIO credentials are used only if the app's own credentials do not exist yet (first
      # deploy). This check needs the kubeconfig and nothing else, so routine releases never load the root secrets.
      - name: Do the hosted services need bootstrapping?
        id: creds
        run: |
          if kubectl --kubeconfig=./"$KUBE_CONFIG" -n "$K8S_NAMESPACE" get secret openprism-app-creds >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "openprism-app-creds exists: skipping the bootstrap"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "openprism-app-creds is missing: bootstrapping Postgres and MinIO (see deploy/bootstrap)"
          fi

      - name: Bootstrap Postgres and the bucket (first deploy only)
        if: steps.creds.outputs.needed == 'true'
        env:
          NAMESPACE: ${{ env.K8S_NAMESPACE }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          MINIO_HOST: ${{ secrets.MINIO_HOST }}
          MINIO_PORT: ${{ secrets.MINIO_PORT }}
          # The S3 API cannot create users or keys, so the app uses this key pair: a dedicated one when the repo has
          # OPENPRISM_S3_ACCESS_KEY / OPENPRISM_S3_SECRET_KEY, otherwise the store's root key (see deploy/helm/README.md).
          S3_ACCESS_KEY: ${{ secrets.OPENPRISM_S3_ACCESS_KEY || secrets.MINIO_ROOT_USER }}
          S3_SECRET_KEY: ${{ secrets.OPENPRISM_S3_SECRET_KEY || secrets.MINIO_ROOT_PASSWORD }}
          # The S3 step runs in this release's api image (boto3), already built by the previous job.
          API_IMAGE: ghcr.io/cent-ischool/openprism/api:${{ needs.check.outputs.tag }}
        run: |
          export KUBECONFIG="$PWD/$KUBE_CONFIG"
          bash deploy/bootstrap/bootstrap.sh

      # Secrets go to files (never into the command line or the script text) and into the chart with --set-file, so
      # values containing commas, quotes or backslashes survive.
      - name: Helm upgrade --install
        id: helm
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          MINIO_HOST: ${{ secrets.MINIO_HOST }}
          MINIO_PORT: ${{ secrets.MINIO_PORT }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          # Optional: empty means the chart leaves them out.
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          OPENPRISM_LLM_API_KEY: ${{ secrets.OPENPRISM_LLM_API_KEY }}
          OPENPRISM_LLM_ENDPOINT: ${{ secrets.OPENPRISM_LLM_ENDPOINT }}
          OPENPRISM_LLM_MODEL: ${{ secrets.OPENPRISM_LLM_MODEL }}
          OPENPRISM_MINERU_TOKEN: ${{ secrets.OPENPRISM_MINERU_TOKEN }}
          SOCIAL_GOOGLE_CLIENT_ID: ${{ secrets.SOCIAL_GOOGLE_CLIENT_ID }}
          SOCIAL_GOOGLE_CLIENT_SECRET: ${{ secrets.SOCIAL_GOOGLE_CLIENT_SECRET }}
          SOCIAL_ORCID_CLIENT_ID: ${{ secrets.SOCIAL_ORCID_CLIENT_ID }}
          SOCIAL_ORCID_CLIENT_SECRET: ${{ secrets.SOCIAL_ORCID_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          for v in POSTGRES_HOST POSTGRES_PORT REDIS_HOST REDIS_PORT MINIO_HOST MINIO_PORT \
                   DJANGO_SECRET_KEY CREDENTIAL_ENCRYPTION_KEY REDIS_PASSWORD; do
            [ -n "${!v:-}" ] || { echo "::error::secret $v is empty or missing"; exit 1; }
          done
          dir="$(mktemp -d)"; chmod 700 "$dir"; trap 'rm -rf "$dir"' EXIT
          setfile=()
          for k in DJANGO_SECRET_KEY CREDENTIAL_ENCRYPTION_KEY REDIS_PASSWORD EMAIL_HOST_USER EMAIL_HOST_PASSWORD \
                   OPENPRISM_LLM_API_KEY OPENPRISM_LLM_ENDPOINT OPENPRISM_LLM_MODEL OPENPRISM_MINERU_TOKEN \
                   SOCIAL_GOOGLE_CLIENT_ID SOCIAL_GOOGLE_CLIENT_SECRET SOCIAL_ORCID_CLIENT_ID SOCIAL_ORCID_CLIENT_SECRET; do
            printf '%s' "${!k:-}" > "$dir/$k"
            setfile+=(--set-file "secrets.$k=$dir/$k")
          done
          helm --kubeconfig=./"$KUBE_CONFIG" upgrade --install "$HELM_RELEASE" ./deploy/helm/openprism \
            -n "$K8S_NAMESPACE" -f ./deploy/helm/openprism/values.yaml \
            --set-string image.tag="$TAG" \
            --set-string postgres.host="$POSTGRES_HOST" --set-string postgres.port="$POSTGRES_PORT" \
            --set-string redis.host="$REDIS_HOST"       --set-string redis.port="$REDIS_PORT" \
            --set-string s3.host="$MINIO_HOST"          --set-string s3.port="$MINIO_PORT" \
            "${setfile[@]}" \
            --wait --wait-for-jobs --timeout 15m

      # Why did it not become ready? Printed while the pods still exist, then the release is put back the way it was:
      # --atomic would remove the pods (and the evidence) before anything could be read.
      - name: Diagnose the failed release
        if: ${{ failure() && steps.helm.outcome == 'failure' }}
        run: |
          export KUBECONFIG="$PWD/$KUBE_CONFIG" NAMESPACE="$K8S_NAMESPACE"
          bash deploy/diagnose.sh

      - name: Roll back the failed release
        if: ${{ failure() && steps.helm.outcome == 'failure' }}
        run: |
          # First install: nothing earlier to return to, so remove it. Upgrade: restore the previous revision.
          revisions="$(helm --kubeconfig=./"$KUBE_CONFIG" -n "$K8S_NAMESPACE" history "$HELM_RELEASE" 2>/dev/null | tail -n +2 | wc -l)"
          if [ "$revisions" -gt 1 ]; then
            # No --wait: the rollback re-creates the previous revision's migrate Job, and --wait made the rollback itself
            # fail when that Job failed (the v0.1.5 incident, #153). The old schema is already applied and that Job is a
            # no-op, so what matters is that the old Deployments are ready, checked by name below.
            helm --kubeconfig=./"$KUBE_CONFIG" -n "$K8S_NAMESPACE" rollback "$HELM_RELEASE" --timeout 10m
            for d in api web beat worker-compile worker-transfer worker-ai; do
              kubectl --kubeconfig=./"$KUBE_CONFIG" -n "$K8S_NAMESPACE" rollout status "deploy/$d" --timeout=5m
            done
            helm --kubeconfig=./"$KUBE_CONFIG" -n "$K8S_NAMESPACE" history "$HELM_RELEASE" | tail -4
          else
            helm --kubeconfig=./"$KUBE_CONFIG" -n "$K8S_NAMESPACE" uninstall "$HELM_RELEASE" || true
          fi

      # helm --wait already gated on readiness; naming each Deployment makes a worker that never came up fail here
      # by name instead of passing silently.
      - name: Rollout status
        run: |
          for d in api web beat worker-compile worker-transfer worker-ai; do
            kubectl --kubeconfig=./"$KUBE_CONFIG" -n "$K8S_NAMESPACE" rollout status "deploy/$d" --timeout=5m
          done

      # Probe the PUBLIC URL from the runner (Caddy -> NodePort -> nginx -> API), and require the version just tagged,
      # so a healthy old pod cannot pass for a rollout that did not happen. Needs the Caddy config (deploy/caddy).
      - name: Smoke-test the public URL serves this version
        run: bash deploy/smoke-release.sh "$PUBLIC_URL" "$VERSION"
