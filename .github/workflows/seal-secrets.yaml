name: Seal secrets for Argo CD

# Turns the GitHub repository secrets into SealedSecrets for namespace openprism and opens a pull request with them (#170).
# GitHub stays the source of truth: to rotate a secret, change the repository secret, run this, merge the pull request.
# Runs on a GitHub-hosted runner and needs no cluster access: it encrypts with the controller's PUBLIC certificate
# (deploy/sealed-secrets/cent-cert.pem); only the controller in the cluster can decrypt. Never add a pull_request trigger:
# the repository is public and this job reads every app secret.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why (shown in the pull request), e.g. 'rotate DJANGO_SECRET_KEY'"
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency: {group: seal-secrets, cancel-in-progress: false}

env:
  KUBESEAL_VERSION: "0.27.1"

jobs:
  seal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Install kubeseal (checked against the release's published checksums)
        run: |
          set -euo pipefail
          v="$KUBESEAL_VERSION"; base="https://github.com/bitnami-labs/sealed-secrets/releases/download/v$v"
          cd "$RUNNER_TEMP"
          curl -sSfLO "$base/kubeseal-$v-linux-amd64.tar.gz"
          curl -sSfLO "$base/sealed-secrets_${v}_checksums.txt"
          grep " kubeseal-$v-linux-amd64.tar.gz\$" "sealed-secrets_${v}_checksums.txt" | sha256sum -c -
          tar -xzf "kubeseal-$v-linux-amd64.tar.gz" kubeseal
          echo "KUBESEAL=$RUNNER_TEMP/kubeseal" >> "$GITHUB_ENV"
      - name: Seal
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SECRET_KEY_FALLBACKS: ${{ secrets.DJANGO_SECRET_KEY_FALLBACKS }}
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          SOCIAL_GOOGLE_CLIENT_ID: ${{ secrets.SOCIAL_GOOGLE_CLIENT_ID }}
          SOCIAL_GOOGLE_CLIENT_SECRET: ${{ secrets.SOCIAL_GOOGLE_CLIENT_SECRET }}
          SOCIAL_ORCID_CLIENT_ID: ${{ secrets.SOCIAL_ORCID_CLIENT_ID }}
          SOCIAL_ORCID_CLIENT_SECRET: ${{ secrets.SOCIAL_ORCID_CLIENT_SECRET }}
          OPENPRISM_LLM_API_KEY: ${{ secrets.OPENPRISM_LLM_API_KEY }}
          OPENPRISM_LLM_ENDPOINT: ${{ secrets.OPENPRISM_LLM_ENDPOINT }}
          OPENPRISM_LLM_MODEL: ${{ secrets.OPENPRISM_LLM_MODEL }}
          OPENPRISM_MINERU_TOKEN: ${{ secrets.OPENPRISM_MINERU_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PASSWORD: ${{ secrets.GHCR_PASSWORD }}
        run: bash deploy/seal-secrets.sh
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          branch="seal-secrets/$(date -u +%Y%m%d%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add deploy/argocd/secrets deploy/argocd/apps/openprism.yaml
          git commit -m "Re-seal the openprism secrets: $REASON"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Re-seal secrets: $REASON" \
            --body "Made by the Seal secrets workflow from the repository secrets (encrypted; only the cluster can read them). Merging lets Argo CD apply them and roll the pods (secrets.revision changed)."
