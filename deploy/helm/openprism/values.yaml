# OpenPrism on the cent cluster. The deploy workflow overrides image.tag and the secrets; everything else is set here
# or in an extra values file (-f). Postgres, Redis and MinIO are the cluster's hosted services: set where they live.

# Deployed by Argo CD (deploy/argocd): the migrate Job becomes a Sync hook, workloads get sync waves, and a PostSync
# Job checks the API reports this chart's version. false = plain Helm (the old deploy workflow and local renders).
argocd:
  enabled: false

image:
  registry: ghcr.io/cent-ischool/openprism   # images are <registry>/{api,web,worker-tex,worker-ai}:<tag>
  tag: ""                                    # empty = "v" + the chart's appVersion (= apps/api/VERSION at the release tag)
  pullSecrets: [ghcr-login-secret]           # created by the workflow from GHCR_USERNAME / GHCR_PASSWORD

# Public hostname served by the external Caddy2 (TLS ends there). Used for APP_BASE_URL, allowed hosts and mail links.
host: openprism.cent-su.org   # placeholder: confirm the hostname Caddy will serve

# The web Service is the only entry point. Caddy proxies the hostname to <node-ip>:nodePort (cluster range 30000-32767;
# 31080 belongs to iot-portal).
nodePort: 31081

# Caddy plus the web nginx sit in front of the API: rate limits key on the real client through both.
trustedProxyCount: 2

# Hosted data services (the workflow fills host and port from the POSTGRES_*, REDIS_* and MINIO_* secrets).
postgres:
  host: postgres.example.svc
  port: 5432
  database: openprism
  user: openprism            # created, with its password, by the bootstrap Job
redis:
  host: redis.example.svc
  port: 6379
  db: 3                      # a database index of our own: the Redis server is shared with other apps
s3:
  scheme: http
  host: minio.example.svc
  port: 9000
  region: us-east-1          # MinIO's default; the app signs with sigv4 and path-style addressing
  bucket: openprism

# Created by the bootstrap Job with keys db-password, s3-access-key and s3-secret-key. Never set by hand or in GitHub.
credentialsSecret: openprism-app-creds

mail:
  host: smtp-relay.syr.edu    # the relay iot-portal and graderthan use
  port: 587
  tls: "1"
  from: "OpenPrism <openprism@cent-su.org>"   # placeholder: confirm the sender address

# Rendered into the openprism-core / openprism-ai Secrets. The workflow passes these with --set-file so values with
# commas or backslashes survive. Only the first three are required; the AI keys are optional server-side defaults.
secrets:
  # true: the chart renders openprism-core / openprism-ai from the values below (the Helm workflow passes them with
  # --set-file). false: they already exist in the namespace (Sealed Secrets under Argo CD, deploy/argocd) and the chart
  # only reads them; then `revision` is what rolls the pods when they change (the seal workflow bumps it).
  create: true
  revision: ""
  DJANGO_SECRET_KEY: ""
  DJANGO_SECRET_KEY_FALLBACKS: ""  # only while rotating DJANGO_SECRET_KEY: the previous key(s), comma-separated (README, "Secrets")
  CREDENTIAL_ENCRYPTION_KEY: ""   # Fernet key(s); never change once users have stored keys (comma-separated rotates)
  REDIS_PASSWORD: ""
  EMAIL_HOST_USER: ""
  EMAIL_HOST_PASSWORD: ""
  OPENPRISM_LLM_API_KEY: ""
  OPENPRISM_LLM_ENDPOINT: ""
  OPENPRISM_LLM_MODEL: ""
  OPENPRISM_MINERU_TOKEN: ""
  # Sign in with Google / ORCID (v0.1.4): a provider is on when both of its values are set. Optional; see README, "Social sign-in".
  SOCIAL_GOOGLE_CLIENT_ID: ""
  SOCIAL_GOOGLE_CLIENT_SECRET: ""
  SOCIAL_ORCID_CLIENT_ID: ""
  SOCIAL_ORCID_CLIENT_SECRET: ""

social:
  orcidSandbox: false     # true: sandbox.orcid.org (register the app there first)

# Who may create an account (v0.1.2). `invite` (default): only addresses a superadmin invited in /admin/ (platform
# invitations) or, unless workspaceInvitesAllowSignup is false, that a workspace admin invited. `open`: anyone who finds
# the site. Make the first superadmin and check that mail works so invitations arrive (README, "Invitation-only access").
registration:
  mode: invite
  workspaceInvitesAllowSignup: true
  contactEmail: ""        # shown on the closed sign-up pages ("write to ...")
  inviteDays: 7           # how long a platform invitation link works

# Two-factor authentication (v0.1.3). Anyone can turn it on under Account settings; when superadminRequireMfa is true
# (default) a superadmin must have it to use /admin/. Enrol BEFORE upgrading from v0.1.2 (README, "Two-factor").
auth:
  superadminRequireMfa: true

# Extra ConfigMap entries (or overrides), e.g. SERVER_LLM_KEY_USERS. Defaults are the application's own.
config:
  ASGI_THREADS: "16"                      # caps the API's thread pool, and so its database connections per pod
  LOG_LEVEL: "INFO"
  LLM_ALLOW_PRIVATE_ENDPOINTS: "0"        # keep 0: user-supplied LLM / MinerU URLs must be public
  OPENPRISM_MINERU_API_BASE: "https://mineru.net/api/v4"
  OPENPRISM_COLLAB_FLUSH_DEBOUNCE_MS: "800"
  OPENPRISM_COLLAB_TOKEN_TTL: "86400"
  COMPILE_TIMEOUT_SECONDS: "120"
  AI_WAIT_SECONDS: "300"
  AI_RATE_PER_MINUTE: "30"                # per user: llm, agent, vision, plot, transfer, arXiv import
  COMPILE_RATE_PER_MINUTE: "30"
  SERVER_LLM_KEY_USERS: "verified"        # who may spend the operator's OPENPRISM_LLM_* key: all|verified|staff|none
  SERVER_LLM_DAILY_QUOTA: "200"           # such jobs per user per UTC day; 0 = no limit
  TEX_CACHE_DIR: "/tmp/openprism-tex-cache"

api:
  replicas: 2
  resources: {requests: {cpu: 250m, memory: 384Mi}, limits: {cpu: "1", memory: 1Gi}}
web:
  replicas: 2
  resources: {requests: {cpu: 20m, memory: 32Mi}, limits: {cpu: 500m, memory: 128Mi}}

workers:
  compile:     # untrusted LaTeX: never reads the LLM credentials
    image: worker-tex
    queues: compile
    concurrency: 2
    replicas: 2
    terminationGracePeriodSeconds: 360      # task hard limit is 330 s
    tmpSize: 2Gi
    aiSecret: false
    internet: false     # NetworkPolicy: untrusted LaTeX never reaches the internet
    resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {cpu: "2", memory: 3Gi, ephemeral-storage: 2Gi}}
  transfer:    # template transfer: LLM calls plus compiles
    image: worker-tex
    queues: transfer
    concurrency: 2
    replicas: 1
    terminationGracePeriodSeconds: 1900     # task hard limit is 1860 s
    tmpSize: 2Gi
    aiSecret: true
    internet: true      # LLM providers, MinerU
    resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {cpu: "2", memory: 3Gi, ephemeral-storage: 2Gi}}
  ai:          # LLM, vision, plot, agent, arXiv import, account mail
    image: worker-ai
    queues: ai,import
    concurrency: 4
    replicas: 2
    terminationGracePeriodSeconds: 1000     # task hard limit is 960 s
    tmpSize: 1Gi
    aiSecret: true
    internet: true      # LLM providers, arXiv
    smtp: true          # the queue that sends account mail (accounts.tasks.send_email)
    resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "1", memory: 2Gi, ephemeral-storage: 1Gi}}

# NetworkPolicies (#112). OFF by default: the cent cluster's CNI is flannel, which does not enforce them, so turning this on
# there changes nothing until the cluster gets an enforcing CNI (Calico, Cilium, ...). See README, "Network policies".
# When on: default deny, DNS, web <- anywhere (Caddy reaches the NodePort), web -> api, pods labelled openprism.io/data ->
# the data services at dataCidrs only, openprism.io/internet -> public HTTPS, openprism.io/smtp -> SMTP submission.
# worker-compile gets data services only: a document that fetches a URL cannot connect.
networkPolicy:
  enabled: false
  dataCidrs: []                 # required when enabled: the addresses of Postgres, Redis and the object store, e.g. ["10.30.78.118/32"]
  webIngressCidrs: ["0.0.0.0/0"]   # who may reach the web pods (Caddy forwards to the NodePort from outside the pod network)

# Sandboxed runtime for the three Celery workers (they run untrusted LaTeX, the compiles inside template transfer, and
# LLM-written Python). Empty = the node's default runtime (runc), which is what the cent cluster has today. Set it to the
# name of a RuntimeClass that exists (gVisor: "gvisor", Kata: "kata"); the pod stays Pending if it does not. See README,
# "Sandboxed runtime and pids limit" (#111) for the decision and the install steps.
sandbox:
  runtimeClassName: ""
