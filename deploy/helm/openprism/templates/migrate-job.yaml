# Database migrations. A Job's pod template is immutable, so each Helm revision gets its own Job (the name carries the
# revision) and Helm removes the previous one. It is not a Helm hook, so the ConfigMap and Secrets exist on the first
# install; the other pods wait for it in their wait-for-migrations init container.
apiVersion: batch/v1
kind: Job
metadata:
  {{- if .Values.argocd.enabled }}
  # Under Argo CD a Sync hook: re-created on every sync (BeforeHookCreation keeps the last run's pods and logs until the
  # next one), in wave 0, after the settings and before the workloads. .Release.Revision is always 1 under Argo.
  name: migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
  {{- else }}
  name: {{ printf "migrate-%s-r%d" (.Values.image.tag | default (printf "v%s" .Chart.AppVersion) | toString | replace "." "-" | lower | trunc 12) .Release.Revision }}
  {{- end }}
  labels: {{- include "openprism.labels" (dict "root" . "name" "migrate") | nindent 4 }}
spec:
  # restartPolicy Never: every failed attempt stays as its own pod with its logs. With OnFailure the container restarts in
  # one pod and the Job controller deletes that pod when activeDeadlineSeconds passes, so a failed deploy lost the very
  # error it needed to explain (#152). The command is bounded by `timeout` so a hung database connection ends as a failed
  # pod (with logs) before the deadline removes it.
  backoffLimit: 3
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {{- include "openprism.labels" (dict "root" . "name" "migrate") | nindent 8 }}
        openprism.io/data: "true"
    spec:
      serviceAccountName: openprism-app
      {{- include "openprism.imagePullSecrets" . | nindent 6 }}
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: migrate
          image: {{ include "openprism.image" (dict "root" . "name" "api") }}
          # Built-in templates ship in the image: load them after the schema is current (idempotent, user templates untouched).
          command: ["sh", "-c", "timeout 240 sh -c 'python manage.py migrate --noinput && python manage.py load_builtin_templates'"]
          {{- include "openprism.envFrom" . | nindent 10 }}
          env:
            {{- include "openprism.env" . | nindent 12 }}
          securityContext:
            {{- include "openprism.locked" . | nindent 12 }}
          resources: {requests: {cpu: 100m, memory: 192Mi}, limits: {memory: 512Mi}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
