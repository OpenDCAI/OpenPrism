apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {{- include "openprism.labels" (dict "root" . "name" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app.kubernetes.io/name: api}}
  template:
    metadata:
      labels: {{- include "openprism.labels" (dict "root" . "name" "api") | nindent 8 }}
      annotations: {{- include "openprism.configChecksum" . | nindent 8 }}
    spec:
      serviceAccountName: openprism-app
      {{- include "openprism.imagePullSecrets" . | nindent 6 }}
      terminationGracePeriodSeconds: 45
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app.kubernetes.io/name: api}}}
      initContainers:
        {{- include "openprism.waitForMigrations" (dict "root" . "image" "api") | nindent 8 }}
      containers:
        - name: api
          image: {{ include "openprism.image" (dict "root" . "name" "api") }}
          command: ["uvicorn", "config.asgi:application", "--host", "0.0.0.0", "--port", "8000", "--timeout-graceful-shutdown", "30"]
          ports: [{name: http, containerPort: 8000}]
          {{- include "openprism.envFrom" . | nindent 10 }}
          env:
            {{- include "openprism.env" . | nindent 12 }}
          # Probes reach the pod by its IP, so their Host header would be 10.x.x.x:8000, which Django's ALLOWED_HOSTS
          # refuses with a 400 (#74). They send Host: api instead; `api` is always in DJANGO_ALLOWED_HOSTS.
          startupProbe: {httpGet: {path: /healthz, port: http, httpHeaders: [{name: Host, value: api}]}, periodSeconds: 3, failureThreshold: 40}
          livenessProbe: {httpGet: {path: /healthz, port: http, httpHeaders: [{name: Host, value: api}]}, periodSeconds: 15, timeoutSeconds: 3, failureThreshold: 3}
          # /readyz checks Postgres, Redis and S3: a pod that cannot reach them leaves rotation instead of restarting.
          readinessProbe: {httpGet: {path: /readyz, port: http, httpHeaders: [{name: Host, value: api}]}, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 2}
          lifecycle: {preStop: {exec: {command: ["sleep", "5"]}}}   # let endpoint removal propagate before SIGTERM
          securityContext:
            {{- include "openprism.locked" . | nindent 12 }}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 512Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: api   # the web nginx proxies to http://api:8000, so the name is fixed
  labels: {{- include "openprism.labels" (dict "root" . "name" "api") | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: api}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: api}
spec:
  minAvailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: api}}
