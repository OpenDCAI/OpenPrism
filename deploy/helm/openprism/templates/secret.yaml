# Chart-managed secrets. Database and object-storage credentials are NOT here: the bootstrap Job creates them in the
# cluster (values.credentialsSecret) so they never pass through GitHub.
apiVersion: v1
kind: Secret
metadata:
  name: openprism-core
type: Opaque
stringData:
  DJANGO_SECRET_KEY: {{ required "secrets.DJANGO_SECRET_KEY is required" .Values.secrets.DJANGO_SECRET_KEY | quote }}
  CREDENTIAL_ENCRYPTION_KEY: {{ required "secrets.CREDENTIAL_ENCRYPTION_KEY is required" .Values.secrets.CREDENTIAL_ENCRYPTION_KEY | quote }}
  REDIS_URL: {{ printf "redis://:%s@%s:%v/%v" (urlquery (required "secrets.REDIS_PASSWORD is required" .Values.secrets.REDIS_PASSWORD)) .Values.redis.host .Values.redis.port .Values.redis.db | quote }}
  EMAIL_HOST_USER: {{ .Values.secrets.EMAIL_HOST_USER | default "" | quote }}
  EMAIL_HOST_PASSWORD: {{ .Values.secrets.EMAIL_HOST_PASSWORD | default "" | quote }}
  SOCIAL_GOOGLE_CLIENT_ID: {{ .Values.secrets.SOCIAL_GOOGLE_CLIENT_ID | default "" | quote }}
  SOCIAL_GOOGLE_CLIENT_SECRET: {{ .Values.secrets.SOCIAL_GOOGLE_CLIENT_SECRET | default "" | quote }}
  SOCIAL_ORCID_CLIENT_ID: {{ .Values.secrets.SOCIAL_ORCID_CLIENT_ID | default "" | quote }}
  SOCIAL_ORCID_CLIENT_SECRET: {{ .Values.secrets.SOCIAL_ORCID_CLIENT_SECRET | default "" | quote }}
{{- $ai := dict }}
{{- range $k := list "OPENPRISM_LLM_API_KEY" "OPENPRISM_LLM_ENDPOINT" "OPENPRISM_LLM_MODEL" "OPENPRISM_MINERU_TOKEN" }}
{{- if index $.Values.secrets $k }}{{ $_ := set $ai $k (index $.Values.secrets $k) }}{{ end }}
{{- end }}
{{- if $ai }}
---
# Server-side AI defaults: only worker-transfer and worker-ai read this Secret.
apiVersion: v1
kind: Secret
metadata:
  name: openprism-ai
type: Opaque
stringData:
  {{- range $k, $v := $ai }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
