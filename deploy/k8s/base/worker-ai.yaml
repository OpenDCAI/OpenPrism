# LLM, vision, plot and agent requests, and arXiv import. Plot rendering runs LLM-written Python in a subprocess.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-ai
  labels: {app.kubernetes.io/name: worker-ai}
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app.kubernetes.io/name: worker-ai}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker-ai
        openprism.io/data: "true"
        openprism.io/internet: "true"   # calls LLM providers / MinerU / arXiv
        openprism.io/smtp: "true"       # sends account mail (queue `import`)
    spec:
      serviceAccountName: openprism-app
      # SIGTERM starts a warm shutdown: Celery finishes the running task. Allow longer than the task's hard time limit
      # (960s), or a rolling update would kill a job part-way through.
      terminationGracePeriodSeconds: 1000
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app.kubernetes.io/name: worker-ai}}}
      initContainers:
        - name: wait-for-migrations
          image: openprism/worker-ai
          command: ["sh", "-c", "until python manage.py migrate --check >/dev/null 2>&1; do echo 'waiting for database migrations'; sleep 3; done"]
          envFrom: [{configMapRef: {name: openprism-config}}, {secretRef: {name: openprism-core}}]
          securityContext: &locked {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 256Mi}}
      containers:
        - name: worker
          image: openprism/worker-ai
          args: ["celery", "-A", "config", "worker", "-Q", "ai,import", "-l", "info", "--concurrency", "4", "--hostname", "worker-ai@%h"]
          envFrom:
            - configMapRef: {name: openprism-config}
            - secretRef: {name: openprism-core}
            - secretRef: {name: openprism-ai, optional: true}   # LLM / MinerU credentials: only this worker sees them
          env:
            - {name: HOME, value: /tmp}
          # Celery answers a broadcast ping when the worker is alive and connected to the broker.
          livenessProbe:
            exec: {command: ["sh", "-c", "celery -A config inspect ping -d worker-ai@$HOSTNAME"]}
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 20
            failureThreshold: 3
          securityContext: *locked
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "1", memory: 2Gi, ephemeral-storage: 1Gi}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 1Gi}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: worker-ai}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: worker-ai}
  minReplicas: 2
  maxReplicas: 6
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}]
