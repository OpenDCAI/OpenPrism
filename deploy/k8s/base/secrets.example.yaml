# NOT applied by kustomize. The two Secrets every environment must provide; create them out of band
# (kubectl create secret, sealed-secrets, External Secrets, ...). Never commit real values.
#
# The split is least-privilege: only the AI/transfer workers see the LLM and MinerU credentials.
apiVersion: v1
kind: Secret
metadata:
  name: openprism-core            # api, all workers, beat, migrate job
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "<50+ random characters; the API refuses to start without it>"
  CREDENTIAL_ENCRYPTION_KEY: "<Fernet key(s), comma-separated, first encrypts; encrypts stored Zotero keys. Losing it makes them unreadable>"
  DATABASE_URL: "postgres://USER:PASSWORD@HOST:5432/DBNAME"
  REDIS_URL: "redis://:PASSWORD@HOST:6379/0"
  S3_ACCESS_KEY_ID: "<access key>"
  S3_SECRET_ACCESS_KEY: "<secret key>"
  EMAIL_HOST_USER: "<SMTP user, empty if the relay needs none>"
  EMAIL_HOST_PASSWORD: "<SMTP password>"
---
apiVersion: v1
kind: Secret
metadata:
  name: openprism-ai              # worker-transfer and worker-ai only; every key is optional
type: Opaque
stringData:
  OPENPRISM_LLM_API_KEY: "<server-side default key; users may also supply their own in the UI>"
  OPENPRISM_LLM_ENDPOINT: "https://api.openai.com/v1/chat/completions"
  OPENPRISM_LLM_MODEL: "gpt-4o-mini"
  OPENPRISM_MINERU_TOKEN: "<MinerU token>"
