# Production starting point. Every value marked CHANGE ME is specific to your environment. Postgres, Redis and object
# storage are expected to be managed services (or provided by operators) reachable from the cluster, and the Secrets
# `openprism-core` and `openprism-ai` must already exist in the namespace (see ../../base/secrets.example.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openprism
resources:
  - namespace.yaml
  - ../../base
# components:
#   - ../../components/keda      # scale workers on queue depth instead of CPU (needs KEDA installed)
images:   # CHANGE ME: images pushed with build-images.sh <tag> <registry/>; pin a release tag, never `latest`
  - {name: openprism/api,         newName: registry.example.com/acme/openprism/api,         newTag: "1.0.0"}
  - {name: openprism/web,         newName: registry.example.com/acme/openprism/web,         newTag: "1.0.0"}
  - {name: openprism/worker-tex,  newName: registry.example.com/acme/openprism/worker-tex,  newTag: "1.0.0"}
  - {name: openprism/worker-ai,   newName: registry.example.com/acme/openprism/worker-ai,   newTag: "1.0.0"}
patches:
  - target: {kind: ConfigMap, name: openprism-config}
    patch: |-
      - {op: replace, path: /data/DJANGO_ALLOWED_HOSTS, value: "openprism.example.com,api"}   # CHANGE ME
      - {op: replace, path: /data/S3_ENDPOINT_URL, value: "https://s3.example.com"}            # CHANGE ME
      - {op: replace, path: /data/S3_PUBLIC_ENDPOINT_URL, value: "https://s3.example.com"}     # CHANGE ME
      - {op: replace, path: /data/S3_REGION, value: "us-east-1"}                                # CHANGE ME
      - {op: replace, path: /data/S3_BUCKET, value: "openprism-prod"}                           # CHANGE ME
      - {op: replace, path: /data/APP_BASE_URL, value: "https://openprism.example.com"}         # CHANGE ME
      - {op: replace, path: /data/EMAIL_HOST, value: "smtp.example.com"}                        # CHANGE ME
      - {op: replace, path: /data/DEFAULT_FROM_EMAIL, value: "OpenPrism <no-reply@openprism.example.com>"}  # CHANGE ME
  - target: {kind: Ingress, name: openprism}
    patch: |-
      - {op: replace, path: /spec/rules/0/host, value: openprism.example.com}                   # CHANGE ME
      - {op: add, path: /spec/tls, value: [{hosts: [openprism.example.com], secretName: openprism-tls}]}
      - {op: add, path: /metadata/annotations/cert-manager.io~1cluster-issuer, value: letsencrypt}
  # The managed data services are outside the cluster, so the in-cluster pod-selector rule cannot match them.
  # CHANGE ME: the addresses of your Postgres, Redis and S3 endpoints (and their ports).
  - target: {kind: NetworkPolicy, name: app-to-data-services}
    patch: |-
      - op: replace
        path: /spec/egress
        value:
          - to: [{ipBlock: {cidr: 10.20.0.0/16}}]
            ports: [{protocol: TCP, port: 5432}, {protocol: TCP, port: 6379}]
          - to: [{ipBlock: {cidr: 203.0.113.0/24}}]
            ports: [{protocol: TCP, port: 443}]
  # The ingress controller's namespace name. CHANGE ME if it is not `ingress-nginx`.
  - target: {kind: NetworkPolicy, name: web-from-ingress}
    patch: |-
      - {op: replace, path: /spec/ingress/0/from/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name, value: ingress-nginx}
