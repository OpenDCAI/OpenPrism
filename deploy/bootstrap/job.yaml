# One-off Job run by bootstrap.sh. It uses the cluster's root Postgres credentials and the S3 key pair (from temporary
# Secrets that bootstrap.sh deletes afterwards) to create the app's database and role, and its bucket.
# The scripts come from the ConfigMap openprism-bootstrap-scripts (pg-init.sh, s3-init.py): the same files that are
# tested in deploy/bootstrap. __PG_IMAGE__ and __API_IMAGE__ are filled in by bootstrap.sh. The S3 step runs in this
# release's api image (it carries boto3 and is already pulled from ghcr.io), because the MinIO client image can no
# longer be pulled anywhere (#71).
apiVersion: batch/v1
kind: Job
metadata:
  name: openprism-bootstrap
  labels: {app.kubernetes.io/name: bootstrap, app.kubernetes.io/part-of: openprism}
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: {app.kubernetes.io/name: bootstrap, app.kubernetes.io/part-of: openprism}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets: [{name: ghcr-login-secret}]
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        - name: postgres
          image: __PG_IMAGE__
          command: ["sh", "/scripts/pg-init.sh"]
          envFrom: [{secretRef: {name: openprism-bootstrap-pg}}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 128Mi}}
          volumeMounts: [{name: scripts, mountPath: /scripts, readOnly: true}]
      containers:
        - name: s3
          image: __API_IMAGE__
          command: ["python", "/scripts/s3-init.py"]
          envFrom: [{secretRef: {name: openprism-bootstrap-s3}}]
          env:
            - {name: HOME, value: /tmp}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 50m, memory: 96Mi}, limits: {memory: 256Mi}}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: scripts, configMap: {name: openprism-bootstrap-scripts}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
