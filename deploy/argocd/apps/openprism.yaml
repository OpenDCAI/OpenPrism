# The OpenPrism release (#167). Two kinds of input, on purpose:
# - the chart (and so the code: image tag = v + appVersion) comes from the release TAG in the first source. A
#   "Deploy vX.Y.Z" pull request changes that one line, and merging it is the deploy. Until the first such release it
#   is the commit of the v0.1.8 chart while it still said 0.1.7.1, so the cutover adopts the running release without
#   changing its version (deploy/argocd/README.md);
# - the cluster's configuration (valuesObject below, in this file) and the SealedSecrets come from MAIN, because this
#   file lives there: a config change or a re-seal is a merged pull request and needs no release. (Argo CD refuses a
#   `$ref` values file from another revision of the same repository, so the values cannot be a file read from main.)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openprism
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"     # after the Sealed Secrets controller (wave 0 in the root app)
spec:
  project: openprism
  sources:
    - repoURL: https://github.com/cent-ischool/OpenPrism.git
      targetRevision: v0.1.10  # the release: the Deploy pull request changes this line only
      path: deploy/helm/openprism
      helm:
        releaseName: openprism            # keeps the resource names and labels of the Helm release it replaces
        # Values for the cent cluster (#167, #168). Not secret: addresses of the hosted services and switches. Checked
        # against the running Helm release on 2026-11-12 (only sync waves, checksums and the hook Jobs differ). CI
        # renders the chart with exactly this block.
        valuesObject:
          argocd:
            enabled: true
          secrets:
            create: false
            revision: "20261113180003"      # bumped by the Seal secrets workflow so a re-seal rolls the pods
          postgres:
            host: storage.cent-su.org
            port: 5432
          redis:
            host: storage.cent-su.org
            port: 6379
          s3:
            host: storage.cent-su.org
            port: 9000
    - repoURL: https://github.com/cent-ischool/OpenPrism.git    # the SealedSecrets for this namespace
      targetRevision: main
      path: deploy/argocd/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: openprism
  # Switched on at the end of the cutover (2026-11-12, #172): every change on main that affects this app deploys.
  syncPolicy:
    automated:
      prune: false      # never delete a resource just because it left the chart; do that by hand
      selfHeal: true    # undo changes made on the cluster that git does not have
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: batch
      kind: Job
      jsonPointers: [/spec/selector, /spec/template/metadata/labels]
