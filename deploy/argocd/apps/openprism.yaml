# The OpenPrism release (#167). Two kinds of input, on purpose:
# - the chart (and so the code: image tag = v + appVersion) comes from the release TAG in the first source. A
#   "Deploy vX.Y.Z" pull request changes that one line, and merging it is the deploy;
# - the cluster's configuration (values-cent.yaml) and the SealedSecrets come from MAIN, so rotating a secret is a merged
#   "Re-seal secrets" pull request and needs no release.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openprism
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"     # after the Sealed Secrets controller (wave 0 in the root app)
spec:
  project: openprism
  sources:
    - repoURL: https://github.com/cent-ischool/OpenPrism.git
      targetRevision: v0.1.8              # the release: the Deploy pull request changes this line only
      path: deploy/helm/openprism
      helm:
        releaseName: openprism            # keeps the resource names and labels of the Helm release it replaces
        valueFiles:
          - $repo/deploy/argocd/values-cent.yaml
    - repoURL: https://github.com/cent-ischool/OpenPrism.git
      targetRevision: main                # values-cent.yaml
      ref: repo
    - repoURL: https://github.com/cent-ischool/OpenPrism.git    # the SealedSecrets for this namespace
      targetRevision: main
      path: deploy/argocd/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: openprism
  # Automated sync is switched on as the last step of the cutover (deploy/argocd/README.md); until then sync by hand.
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: batch
      kind: Job
      jsonPointers: [/spec/selector, /spec/template/metadata/labels]
