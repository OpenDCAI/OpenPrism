# Sealed Secrets controller (#166). Pinned: bump on purpose, after reading the upstream changelog.
# Back up the sealing key right after the first install (deploy/argocd/README.md, "Sealing key"): without it the
# SealedSecrets in git cannot be decrypted by a new controller, and they must be re-sealed from the GitHub secrets.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: openprism-platform
  source:
    repoURL: https://bitnami.github.io/sealed-secrets   # moved from bitnami-labs.github.io (404 since)
    chart: sealed-secrets
    targetRevision: 2.16.1
    helm:
      releaseName: sealed-secrets-controller   # the name kubeseal looks for by default
      valuesObject:
        fullnameOverride: sealed-secrets-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated: {prune: false, selfHeal: true}
